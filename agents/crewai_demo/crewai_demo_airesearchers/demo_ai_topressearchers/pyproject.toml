[project]
name = "demo_ai_topressearchers"
version = "0.1.0"
description = "demo_ai_topressearchers using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,litellm,tools]>=1.15.23,<2.0.0",
    "litellm>=1.106.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "b19ac28c-c53b-491f-b534-e126a09f14a6"
