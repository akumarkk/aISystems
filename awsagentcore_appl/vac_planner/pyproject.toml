[project]
name = "vac_planner"
version = "0.1.0"
description = "vac_planner using crewAI"
authors = [{ name = "ani kris", email = "anikris@craftinc.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,litellm,tools]>=1.15.23,<2.0.0",
    "litellm>=1.106.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "2c4f89b8-42e8-4144-8610-95f64c883c39"
